---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-secrets
  namespace: banana
spec:
  refreshInterval: 20s
  secretStoreRef:
    kind: SecretStore
    name: secret-store
  target:
    name: keycloak-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: id:29c4f549-94b6-49fa-9838-bf632c057ab6
        version: latest_enabled
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: id:e7f36ba0-48a8-4e90-a02d-b5ca5e663ca8
        version: latest_enabled