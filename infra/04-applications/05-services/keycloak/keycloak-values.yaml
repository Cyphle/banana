# Configuration de l'authentification admin
auth:
  existingSecret: "keycloak-secrets"
  passwordSecretKey: "KEYCLOAK_ADMIN_PASSWORD"
  existingSecretUsernameKey: "KEYCLOAK_ADMIN"

## Configuration de la base de données PostgreSQL
postgresql:
  enabled: false

keycloak:
  image: bitnami/keycloak:25.1.2

# Configuration du service
service:
  type: ClusterIP
  ports:
    http: 80

# Configuration Ingress avec cert-manager
ingress:
  enabled: true
  ingressClassName: "nginx"
  hostname: "oidc.bananaam.fr"
  tls: true

  annotations:
    # Cert-manager
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

production: true
proxyHeaders: "xforwarded"
proxy: edge

# Variables d'environnement Keycloak
extraEnvVars:
  # Configuration hostname v2 avec HTTPS strict
  - name: KC_HOSTNAME_URL
    value: "https://oidc.bananaam.fr"
  - name: KC_HOSTNAME_ADMIN_URL
    value: "https://oidc.bananaam.fr"

  # Configuration proxy v2 - CORRIGÉE
  - name: KC_PROXY_HEADERS
    value: "xforwarded"

  # AJOUT CRITIQUE : Forcer le contexte sécurisé
  - name: KC_PROXY
    value: "edge"

  # Headers de proxy pour forcer HTTPS
  - name: KC_PROXY_ADDRESS_FORWARDING
    value: "true"

  # Activer HTTP pour les communications internes
  - name: KC_HTTP_ENABLED
    value: "true"

  # Configuration logging
  - name: KC_LOG_LEVEL
    value: "INFO"

  # Configuration JVM
  - name: JAVA_OPTS_APPEND
    value: "-Xms1024m -Xmx2048m -XX:+UseG1GC -XX:+UseStringDeduplication -XX:MaxRAMPercentage=75"

# Base de données externe (désactive PostgreSQL embarqué)
externalDatabase:
  host: "172.16.16.8"
  port: 5432
  database: "keycloak"
  existingSecret: "keycloak-secrets"
  existingSecretUserKey: "POSTGRES_USER"
  existingSecretPasswordKey: "POSTGRES_PASSWORD"

# Réplication pour HA
replicaCount: 1

# Ressources
resources:
  requests:
    memory: 1Gi
    cpu: 500m
  limits:
    memory: 2Gi

# Sondes de santé avec délais appropriés
livenessProbe:
  enabled: true
  initialDelaySeconds: 300
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3

# Configuration pour la haute disponibilité
podDisruptionBudget:
  create: true
  minAvailable: 1

# Affinity pour répartir les pods sur différents nœuds
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - keycloak
          topologyKey: kubernetes.io/hostname