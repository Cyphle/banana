#    value: "edge"
#  - name: JAVA_OPTS_APPEND
#    value: "-Xms512m -Xmx1024m"
  # KEYCLOAK_EXTRA_ARGS: --hostname-admin-url=http://localhost:9999
  # KEYCLOAK_PRODUCTION: "true"
  # HOME_PAGE_URL: "https://oidc.bananaam.fr"
  #- name: KEYCLOAK_FRONTEND_URL
  #    value: "https://oidc.bananaam.fr"

  # Variables pour la connexion à la base de données (utilisation d'une base externe)
