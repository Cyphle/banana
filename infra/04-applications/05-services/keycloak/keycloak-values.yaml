# Base de données externe (désactive PostgreSQL embarqué)
externalDatabase:
  host: "172.16.16.8"
  port: 5432
  database: "keycloak"
  existingSecret: "keycloak-secrets"
  existingSecretUserKey: "POSTGRES_USER"
  existingSecretPasswordKey: "POSTGRES_PASSWORD"

# Réplication pour HA
replicaCount: 1

# Ressources
resources:
  requests:
    memory: 512Mi
    cpu: 500m
  limits:
    memory: 1Gi
    cpu: 1000m

# Sondes de santé avec délais appropriés
livenessProbe:
  enabled: true
  initialDelaySeconds: 300
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3

# Configuration pour la haute disponibilité
podDisruptionBudget:
  create: true
  minAvailable: 1

# Affinity pour répartir les pods sur différents nœuds
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - keycloak
          topologyKey: kubernetes.io/hostname