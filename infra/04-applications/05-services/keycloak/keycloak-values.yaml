keycloak:
  image: bitnami/keycloak:25.1.2

# Configuration du service
service:
  type: ClusterIP
  ports:
    http: 80

# Configuration Ingress avec cert-manager
ingress:
  enabled: true
  ingressClassName: "nginx"
  hostname: "oidc.bananaam.fr"
  tls: true

  annotations:
    # Cert-manager
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # NGINX optimisations pour Keycloak
#    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
#    nginx.ingress.kubernetes.io/proxy-buffering: "on"
#    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
#    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
#    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
#    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
#    nginx.ingress.kubernetes.io/proxy-body-size: "1m"

production: true
#tls:
#  enabled: true

# SOLUTION 1: Configuration proxy headers (recommandée)
proxyHeaders: "xforwarded"
# Configuration du proxy (important pour Keycloak derrière ingress)
proxy: edge
#proxy: passthrough

# Variables d'environnement Keycloak
extraEnvVars:
  # Configuration hostname v2 avec HTTPS strict
  - name: KC_HOSTNAME_URL
    value: "https://oidc.bananaam.fr"
  - name: KC_HOSTNAME_ADMIN_URL
    value: "https://oidc.bananaam.fr"

  # Configuration proxy v2 - CORRIGÉE
  - name: KC_PROXY_HEADERS
    value: "xforwarded"

  # AJOUT CRITIQUE : Forcer le contexte sécurisé
  - name: KC_PROXY
    value: "edge"

  # Headers de proxy pour forcer HTTPS
  - name: KC_PROXY_ADDRESS_FORWARDING
    value: "true"

  # Activer HTTP pour les communications internes
  - name: KC_HTTP_ENABLED
    value: "true"

  # Configuration logging
  - name: KC_LOG_LEVEL
    value: "INFO"

  # Configuration JVM
  - name: JAVA_OPTS_APPEND
    value: "-Xms1024m -Xmx2048m -XX:+UseG1GC -XX:+UseStringDeduplication -XX:MaxRAMPercentage=75"

  #  - name: KC_HOSTNAME
#    value: "oidc.bananaam.fr"
