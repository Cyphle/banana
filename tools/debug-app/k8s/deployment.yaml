apiVersion: apps/v1
kind: Deployment
metadata:
  name: debug-app
  labels:
    app: debug-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debug-app
  template:
    metadata:
      labels:
        app: debug-app
    spec:
      containers:
        - name: debug-app
          image: debug-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BIND_ADDR
              value: "0.0.0.0:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: debug-app
  labels:
    app: debug-app
spec:
  selector:
    app: debug-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
